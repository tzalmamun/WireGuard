services:
  tz-wg:
    build: .
    container_name: tz-wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-4444}:8080/tcp"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-tzalmamun}"
      WG_PORT: "${WG_PORT:-51820}"
      SERVER_HOST: "${SERVER_HOST:-}"
      WG_DNS: "${WG_DNS:-1.1.1.1, 8.8.8.8}"
      WG_MTU: "${WG_MTU:-1380}"
      TZ_OFFSET_HOURS: "${TZ_OFFSET_HOURS:-6}"
      PANEL_LISTEN_PORT: "8080"
      TLS: "1"
    volumes:
      - ./data:/data
